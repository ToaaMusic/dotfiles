<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/usr/share/xml/fontconfig/fonts.dtd">
<fontconfig>

	<!-- Sans-serif -->
	<match target="pattern">
		<test name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>LXGW ZhenKai GB</string>
		</edit>
	</match>

	<!-- Serif -->
	<match target="pattern">
		<test name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>LXGW ZhenKai GB</string>
		</edit>
	</match>

	<!-- Monospace -->
	<match target="pattern">
		<test name="family">
			<string>monospace</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Maple Mono NF CN</string>
		</edit>
	</match>

</fontconfig>
