# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
show_hidden = true
ratio = [1, 2, 4] # 至少一列，分母可变

sort_translit = true
linemode = "size"

scrolloff = 200
title_format = ""

[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
]
run = [
  { run = 'chmod +x %s; %s --appimage-extract-and-run', desc = "Run AppImage", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.AppImage", use = "run" },
  { url = "*.appimage", use = "run" },
]

[preview]
wrap = "yes"
