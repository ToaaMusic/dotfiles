# default: https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
# docs: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio = [1, 2, 4] # 至少一列，分母可变

sort_translit = true

linemode = "size"

show_hidden = true

scrolloff = 200

[preview]
wrap = "yes"

[opener]
run_appimage = [
  { run = 'chmod +x %s; %s --appimage-extract-and-run', desc = "Run AppImage", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.AppImage", use = "run_appimage" },
]
